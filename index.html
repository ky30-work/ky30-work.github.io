<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>龟仙人的作品集</title>
  <style>
    :root {
      --yellow: #f5c542;
      --yellow-light: #fff7db;
      --ink: #24231f;
      --muted: #85837b;
      --line: #eeece5;
      --surface: #ffffff;
      --background: #faf9f5;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--background);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }
    button { font: inherit; }
    .topbar {
      height: 72px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 18px; font-weight: 750; }
    .brand-mark {
      display: grid; width: 34px; height: 34px; place-items: center;
      border-radius: 11px; background: var(--yellow); font-weight: 900;
    }
    .top-note { color: var(--muted); font-size: 13px; }
    main { width: min(1120px, 88%); margin: 0 auto; padding: 58px 0 72px; }
    .hero {
      display: flex; align-items: center; justify-content: space-between; gap: 28px;
      padding: 36px 40px; border: 1px solid #f1e7c2; border-radius: 24px;
      background: linear-gradient(110deg, #fff5cf, #fffdf6 72%);
    }
    .eyebrow { margin: 0 0 12px; color: #94731a; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 44px); letter-spacing: -1px; }
    .hero p:last-child { margin: 12px 0 0; color: #77736a; line-height: 1.7; }
    .upload-button {
      flex: 0 0 auto; padding: 13px 20px; color: #211e14; background: var(--yellow);
      border: 0; border-radius: 12px; font-weight: 750; cursor: pointer;
      box-shadow: 0 5px 14px #dfb43533; transition: transform .18s, background .18s;
    }
    .upload-button:hover { transform: translateY(-2px); background: #f0bb26; }
    .upload-button:disabled { opacity: .65; cursor: wait; transform: none; }
    .section-heading {
      display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 42px 0 18px;
    }
    h2 { margin: 0; font-size: 22px; }
    .count { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter {
      padding: 8px 14px; color: #69675f; background: white; border: 1px solid var(--line);
      border-radius: 999px; cursor: pointer; font-size: 13px;
    }
    .filter.active { color: #302713; border-color: var(--yellow); background: var(--yellow-light); font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .card {
      overflow: hidden; background: var(--surface); border: 1px solid var(--line);
      border-radius: 17px; transition: transform .2s, box-shadow .2s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 12px 26px #28230c0d; }
    .preview {
      position: relative; display: grid; height: 210px; place-items: center;
      overflow: hidden; background: #f1efe8; cursor: pointer;
    }
    .preview img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { padding: 15px 16px 16px; }
    .card-title { overflow: hidden; margin: 0; font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
    .card-meta { display: flex; align-items: center; gap: 10px; margin-top: 11px; }
    .tag {
      padding: 5px 9px; color: #785d11; background: var(--yellow-light);
      border-radius: 999px; font-size: 11px; font-weight: 700;
    }
    .file-size { margin-left: auto; color: var(--muted); font-size: 12px; }
    .delete-button {
      flex: 0 0 auto; padding: 5px 9px; color: #a63e32; background: #fff3f1;
      border: 1px solid #f1d2cd; border-radius: 8px; cursor: pointer; font-size: 12px;
    }
    .delete-button:hover { color: #fff; background: #bd4d3e; border-color: #bd4d3e; }
    .delete-button:disabled { opacity: .6; cursor: wait; }
    .empty {
      grid-column: 1 / -1; padding: 66px 20px; color: var(--muted); background: white;
      border: 1px dashed #dedbd1; border-radius: 17px; text-align: center;
    }
    .empty-icon { margin-bottom: 12px; font-size: 38px; }
    .empty strong { display: block; margin-bottom: 7px; color: #555249; }
    dialog {
      width: min(760px, 92vw); max-height: 88vh; padding: 0; overflow: hidden;
      border: 0; border-radius: 18px; box-shadow: 0 24px 80px #0003;
    }
    dialog::backdrop { background: #181712aa; }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between; padding: 15px 20px;
      border-bottom: 1px solid var(--line);
    }
    .modal-head strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .close-button { padding: 4px 8px; color: #68655d; background: none; border: 0; cursor: pointer; font-size: 22px; }
    .modal-content {
      display: grid; min-height: 220px; max-height: 70vh; place-items: center;
      padding: 20px; overflow: auto; background: #f7f6f2;
    }
    .modal-content img { max-width: 100%; max-height: 62vh; }
    @media (max-width: 760px) {
      main { width: 92%; padding-top: 30px; }
      .topbar { padding: 0 4%; }
      .top-note { display: none; }
      .hero { align-items: flex-start; flex-direction: column; padding: 27px 24px; }
      .section-heading { align-items: flex-start; flex-direction: column; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
      .preview { height: 170px; }
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
      .preview { height: 220px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">作</span><span>龟仙人的作品集</span></div>
    <div class="top-note">记录灵感 · 展示创作</div>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">MY CREATIVE SPACE</p>
        <h1>每一份创作，都值得被看见。</h1>
        <p>一个简单的个人作品空间，整理并展示你的设计与创意作品。</p>
      </div>
      <button class="upload-button" id="openUpload">＋ 上传图片</button>
    </section>

    <section class="section-heading">
      <div>
        <h2>作品展示</h2>
        <div class="count" id="count">正在加载作品…</div>
      </div>
      <nav class="filters" aria-label="作品分类">
        <button class="filter active" data-category="全部">全部</button>
        <button class="filter" data-category="PS">PS</button>
        <button class="filter" data-category="AI">AI</button>
        <button class="filter" data-category="AU">AU</button>
        <button class="filter" data-category="3D Max">3D Max</button>
      </nav>
    </section>

    <section class="grid" id="作品网格" aria-live="polite"></section>
    <input id="fileInput" type="file" multiple hidden accept="image/*" />

    <dialog id="previewDialog">
      <div class="modal-head">
        <strong id="modalTitle"></strong>
        <button class="close-button" id="closeModal" aria-label="关闭">×</button>
      </div>
      <div class="modal-content" id="modalContent"></div>
    </dialog>
  </main>

  <script>
    // 浏览器端只能使用 Supabase publishable/anon key；不要把 service_role key 放在网页中。
    const SUPABASE_URL = "https://ksotjfwekiquoumbnpno.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5GGVkmqdb14vPyx6MfcKEQ_NYKJZxfh";
    const BUCKET_NAME = "my-works";
    // 仅作为二次确认；公开网页源码中可见，不是安全认证。
    const DELETE_CONFIRMATION_KEY = "070414";
    const UPLOAD_CONFIRMATION_KEY = DELETE_CONFIRMATION_KEY;
    const CATEGORIES = ["PS", "AI", "AU", "3D Max"];
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const works = [];
    let activeCategory = "全部";
    let isLoading = false;

    const grid = document.getElementById("作品网格");
    const fileInput = document.getElementById("fileInput");
    const uploadButton = document.getElementById("openUpload");
    const dialog = document.getElementById("previewDialog");

    uploadButton.addEventListener("click", () => fileInput.click());

    document.querySelectorAll(".filter").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelector(".filter.active").classList.remove("active");
        button.classList.add("active");
        activeCategory = button.dataset.category;
        render();
      });
    });

    fileInput.addEventListener("change", async (event) => {
      const selectedFiles = Array.from(event.target.files || []);
      if (!selectedFiles.length) return;

      const enteredUploadKey = window.prompt("请输入上传确认密钥以继续：");
      if (enteredUploadKey === null) {
        fileInput.value = "";
        return;
      }
      if (enteredUploadKey !== UPLOAD_CONFIRMATION_KEY) {
        alert("确认密钥错误，已取消上传。");
        fileInput.value = "";
        return;
      }

      const categoryInput = window.prompt("请选择分类：PS、AI、AU 或 3D Max", "PS");
      if (categoryInput === null) {
        fileInput.value = "";
        return;
      }

      const categoryMap = {
        ps: "PS", photoshop: "PS",
        ai: "AI", illustrator: "AI",
        au: "AU", audition: "AU",
        "3d max": "3D Max", "3dmax": "3D Max", "3ds max": "3D Max"
      };
      const category = categoryMap[categoryInput.trim().toLowerCase()];
      if (!category) {
        alert("请输入 PS、AI、AU 或 3D Max。");
        fileInput.value = "";
        return;
      }

      const nonImages = selectedFiles.filter((file) => !file.type.startsWith("image/"));
      if (nonImages.length) {
        alert("这里只支持上传图片文件。");
        fileInput.value = "";
        return;
      }

      uploadButton.disabled = true;
      let uploadedCount = 0;
      const errors = [];
      try {
        for (const file of selectedFiles) {
          const safeName = file.name.normalize("NFKC").replace(/[\\/?%*:|"<>]/g, "_");
          const uniqueName = `${crypto.randomUUID()}__${safeName}`;
          const objectPath = `${category}/${uniqueName}`;
          const { error } = await supabaseClient.storage
            .from(BUCKET_NAME)
            .upload(objectPath, file, {
              cacheControl: "3600",
              contentType: file.type,
              upsert: false
            });

          if (error) errors.push(`${file.name}：${error.message}`);
          else uploadedCount += 1;
        }

        if (uploadedCount > 0) await loadWorks();
        if (errors.length) alert(`有 ${errors.length} 个文件上传失败：\n${errors.join("\n")}`);
        else if (uploadedCount > 0) alert(`成功上传 ${uploadedCount} 张图片。`);
      } catch (error) {
        console.error("上传或读取 Supabase Storage 失败：", error);
        alert(`操作失败：${error.message || "请检查网络及 Supabase Storage 策略。"}`);
      } finally {
        uploadButton.disabled = false;
        uploadButton.textContent = "＋ 上传图片";
        fileInput.value = "";
      }
    });

    function formatSize(bytes) {
      if (!Number.isFinite(bytes) || bytes <= 0) return "图片";
      if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    async function loadWorks() {
      isLoading = true;
      render();
      try {
        const results = await Promise.all(CATEGORIES.map(async (category) => {
          const { data, error } = await supabaseClient.storage
            .from(BUCKET_NAME)
            .list(category, {
              limit: 1000,
              sortBy: { column: "created_at", order: "desc" }
            });
          if (error) throw error;

          return (data || [])
            .filter((object) => object.name && object.metadata)
            .map((object) => {
              const objectPath = `${category}/${object.name}`;
              const { data: publicData } = supabaseClient.storage
                .from(BUCKET_NAME)
                .getPublicUrl(objectPath);
              const name = object.name.includes("__")
                ? object.name.slice(object.name.indexOf("__") + 2)
                : object.name;
              return {
                id: objectPath,
                path: objectPath,
                name,
                category,
                size: Number(object.metadata.size) || 0,
                url: publicData.publicUrl,
                createdAt: object.created_at || ""
              };
            });
        }));

        works.splice(0, works.length, ...results.flat());
        works.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
      } catch (error) {
        console.error("读取 Supabase Storage 失败：", error);
        document.getElementById("count").textContent = "作品加载失败";
        grid.innerHTML = "<div class=\"empty\"><div class=\"empty-icon\">⚠️</div><strong>无法加载作品</strong><span>请检查 Supabase Storage 桶和读取策略设置。</span></div>";
      } finally {
        isLoading = false;
        render();
      }
    }

    async function deleteWork(item, button) {
      if (!window.confirm(`确定要永久删除「${item.name}」吗？此操作无法撤销。`)) return;

      const enteredKey = window.prompt("请输入删除确认密钥以继续：");
      if (enteredKey === null) return;
      if (enteredKey !== DELETE_CONFIRMATION_KEY) {
        alert("确认密钥错误，未删除作品。");
        return;
      }

      button.disabled = true;
      button.textContent = "删除中…";
      try {
        const { error } = await supabaseClient.storage
          .from(BUCKET_NAME)
          .remove([item.path]);
        if (error) throw error;

        const index = works.findIndex((work) => work.path === item.path);
        if (index !== -1) works.splice(index, 1);
        render();
      } catch (error) {
        console.error("删除 Supabase Storage 图片失败：", error);
        alert(`删除失败：${error.message || "请检查 Storage 删除权限后重试。"}`);
        button.disabled = false;
        button.textContent = "删除";
      }
    }

    function render() {
      const visibleWorks = activeCategory === "全部"
        ? works
        : works.filter((item) => item.category === activeCategory);

      document.getElementById("count").textContent = isLoading
        ? "正在加载作品…"
        : `共 ${works.length} 件作品`;
      grid.replaceChildren();

      if (isLoading && works.length === 0) {
        const loading = document.createElement("div");
        loading.className = "empty";
        loading.textContent = "正在从 Supabase 加载作品…";
        grid.append(loading);
        return;
      }

      if (!visibleWorks.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML = "<div class='empty-icon'>✨</div><strong>还没有作品</strong><span>点击上方「上传图片」，添加你的第一个创作。</span>";
        grid.append(empty);
        return;
      }

      visibleWorks.forEach((item) => {
        const card = document.createElement("article");
        card.className = "card";

        const preview = document.createElement("div");
        preview.className = "preview";
        preview.addEventListener("click", () => openPreview(item));
        const image = document.createElement("img");
        image.src = item.url;
        image.alt = item.name;
        image.loading = "lazy";
        preview.append(image);

        const info = document.createElement("div");
        info.className = "card-info";
        const title = document.createElement("h3");
        title.className = "card-title";
        title.textContent = item.name;
        const meta = document.createElement("div");
        meta.className = "card-meta";
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = item.category;
        const size = document.createElement("span");
        size.className = "file-size";
        size.textContent = formatSize(item.size);
        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "删除";
        deleteButton.setAttribute("aria-label", `删除作品 ${item.name}`);
        deleteButton.addEventListener("click", () => deleteWork(item, deleteButton));

        meta.append(tag, size, deleteButton);
        info.append(title, meta);
        card.append(preview, info);
        grid.append(card);
      });
    }

    function openPreview(item) {
      const content = document.getElementById("modalContent");
      content.replaceChildren();
      document.getElementById("modalTitle").textContent = item.name;
      const image = document.createElement("img");
      image.src = item.url;
      image.alt = item.name;
      content.append(image);
      dialog.showModal();
    }

    document.getElementById("closeModal").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) dialog.close();
    });

    loadWorks();
  </script>
</body>
</html>
