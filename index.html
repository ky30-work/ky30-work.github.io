<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff3b8" />
  <title>龟仙人的作品集</title>
  <style>
    :root{--brown:#76502f;--dark:#4f3928;--muted:#8d7964;--yellow:#f5d875;--line:#d7c6a3;--surface:#fffefa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--dark);background:#f8f6f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    button{font:inherit}.topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;height:72px;padding:0 max(5%,calc((100% - 1120px)/2));background:#fffdf4ed;border-bottom:1px solid #e8dfca}
    .brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:800}.brand-mark{display:grid;width:42px;height:42px;place-items:center;overflow:hidden;border:1px solid #efdfb3;border-radius:50%;background:#fff4c8}.brand-mark img{width:100%;height:100%;object-fit:contain}.top-note{color:var(--muted);font-size:13px}
    main{width:min(1120px,90%);margin:0 auto;padding:36px 0}.hero{display:flex;min-height:220px;align-items:center;justify-content:space-between;gap:24px;padding:32px clamp(22px,5vw,52px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(120deg,#fffefa,#fff5d5);box-shadow:0 12px 34px #5a3e231a}.hero-copy{max-width:580px}.eyebrow{color:#966c36;font-size:12px;font-weight:800;letter-spacing:1.5px}h1{margin:8px 0;color:var(--dark);font-size:clamp(28px,4vw,43px)}.hero-copy p:last-child{color:#806d59;line-height:1.8}.hero-art{display:flex;align-items:center;gap:8px}.hero-art img{width:100px;height:130px;object-fit:contain}.upload-button{padding:13px 19px;color:#4e3822;background:var(--yellow);border:1px solid #e8c45d;border-radius:13px;cursor:pointer;font-weight:800}.upload-button:disabled{opacity:.65;cursor:wait}
    .section-heading{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:36px 0 17px}.heading-title{display:flex;align-items:center;gap:10px}h2{margin:0;font-size:22px}.heading-mascot{width:42px;height:42px;object-fit:contain}.count{margin-top:5px;color:var(--muted);font-size:13px}.filters{display:flex;flex-wrap:wrap;gap:8px}.filter{padding:8px 13px;color:#76634f;background:#fff;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px}.filter.active{color:#5c4024;border-color:#c5a85e;background:#fff3c8;font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{overflow:hidden;background:var(--surface);border:1.5px solid #cbb894;border-radius:18px;box-shadow:0 6px 20px #4a341f1f}.preview{display:grid;height:210px;place-items:center;overflow:hidden;background:#fffdf8;border-bottom:1px solid #e0d4bd;cursor:pointer}.preview img{width:100%;height:100%;object-fit:cover}.preview-file{display:grid;width:100%;height:100%;place-content:center;justify-items:center;gap:8px;color:#78572d;background:linear-gradient(135deg,#fffdf8,#fff5d8)}.preview-file-icon{font-size:48px}.card-info{padding:14px 15px}.card-title{overflow:hidden;margin:0;font-size:15px;text-overflow:ellipsis;white-space:nowrap}.card-meta{display:flex;align-items:center;gap:9px;margin-top:11px}.tag{padding:5px 9px;color:#78572d;background:#fff2c9;border-radius:999px;font-size:11px;font-weight:700}.file-size{margin-left:auto;color:var(--muted);font-size:12px}.delete-button{padding:5px 9px;color:#9a5142;background:#fff5f1;border:1px solid #e3c2b5;border-radius:8px;cursor:pointer;font-size:12px}.delete-button:disabled{opacity:.6;cursor:wait}.empty{grid-column:1/-1;padding:58px 20px;color:var(--muted);background:#fff;border:1.5px dashed #cbb894;border-radius:18px;text-align:center}.empty strong{display:block;margin-bottom:7px;color:var(--brown)}
    .footer-mascots{display:flex;justify-content:center;gap:40px;margin:30px auto 4px}.footer-mascots img{width:62px;height:55px;object-fit:contain}dialog{width:min(760px,92vw);max-height:88vh;padding:0;overflow:hidden;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 80px #0003}dialog::backdrop{background:#2f231895;backdrop-filter:blur(3px)}.modal-head{display:flex;justify-content:space-between;padding:15px 20px;background:#fff;border-bottom:1px solid var(--line)}.close-button{border:0;background:none;cursor:pointer;font-size:22px}.modal-content{display:grid;min-height:220px;max-height:70vh;place-items:center;padding:20px;overflow:auto;background:#fff}.modal-content img{max-width:100%;max-height:62vh}.max-download{display:grid;justify-items:center;gap:12px;color:var(--muted);text-align:center}.max-download a{padding:11px 18px;color:#4e3822;background:var(--yellow);border:1px solid #e8c45d;border-radius:10px;font-weight:700;text-decoration:none}
    @media(max-width:760px){main{width:92%;padding-top:25px}.topbar{padding:0 4%}.top-note{display:none}.hero{flex-wrap:wrap;padding:25px 23px}.hero-art img{width:75px;height:100px}.section-heading{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.preview{height:170px}}
    @media(max-width:480px){.hero-art{display:none}.upload-button{width:100%}.grid{grid-template-columns:1fr}.preview{height:220px}.footer-mascots{gap:12px}.footer-mascots img{width:48px;height:45px}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark"><img src="./pum2.png" alt="" /></span><span>龟仙人的作品集</span></div><div class="top-note">一点灵感 · 一点布丁狗的可爱</div></header>
  <main>
    <section class="hero"><div class="hero-copy"><p class="eyebrow">MY CREATIVE SPACE</p><h1>每一份创作，都值得被看见。</h1><p>欢迎来到我的小小创作空间，愿每个灵感都像布丁一样甜。</p></div><div class="hero-art" aria-hidden="true"><img src="./pum1.png" alt="" /><img src="./pum3.png" alt="" /></div><button class="upload-button" id="openUpload" type="button">＋ 上传作品</button></section>
    <section class="section-heading"><div><div class="heading-title"><h2>作品展示</h2><img class="heading-mascot" src="./pum4.png" alt="" /></div><div class="count" id="count">正在加载作品…</div></div><nav class="filters" aria-label="作品分类"><button class="filter active" data-category="全部">全部</button><button class="filter" data-category="PS">PS</button><button class="filter" data-category="AI">AI</button><button class="filter" data-category="AU">AU</button><button class="filter" data-category="3D Max">3D Max</button></nav></section>
    <section class="grid" id="作品网格" aria-live="polite"></section><div class="footer-mascots" aria-hidden="true"><img src="./pum3.png" alt="" /><img src="./pum4.png" alt="" /><img src="./pum5.png" alt="" /></div>
    <input id="fileInput" type="file" multiple hidden accept="image/*,.max" />
    <dialog id="previewDialog"><div class="modal-head"><strong id="modalTitle"></strong><button class="close-button" id="closeModal" type="button" aria-label="关闭">×</button></div><div class="modal-content" id="modalContent"></div></dialog>
  </main>
  <script>
    const SUPABASE_URL = "https://ksotjfwekiquoumbnpno.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5GGVkmqdb14vPyx6MfcKEQ_NYKJZxfh";
    const BUCKET_NAME = "my-works";
    // 仅为防误操作提示，不是安全认证；网页源码中的值对访客可见。
    const CONFIRMATION_KEY = "070414";
    const CATEGORIES = ["PS", "AI", "AU", "3D Max"];
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const works = [];
    let activeCategory = "全部";
    let isLoading = false;
    const grid = document.getElementById("作品网格");
    const fileInput = document.getElementById("fileInput");
    const uploadButton = document.getElementById("openUpload");
    const dialog = document.getElementById("previewDialog");
    const isMaxName = (name) => /\.max$/i.test(name);
    function storagePrefixes(category) { return category === "3D Max" ? ["3D-Max", "3D Max"] : [category]; }
    function formatSize(bytes) {
      if (!Number.isFinite(bytes) || bytes <= 0) return "文件";
      if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }
    function uploadErrorMessage(error, file) {
      const status = Number(error?.statusCode || error?.status || 0);
      const detail = error?.message || error?.error || "未知错误";
      let hint = "";
      if (status === 400 || /mime|content.?type|bucket/i.test(detail)) {
        hint = "请在 Supabase Storage 的 my-works 桶设置中允许 application/octet-stream（或放宽允许的 MIME 类型），并确认桶的文件大小上限足够。";
      } else if (status === 413 || /size|large|payload/i.test(detail)) {
        hint = "文件可能超过 Storage 桶的单文件大小限制；请调高 Supabase 项目/桶的文件大小上限。大文件建议改用 TUS 可续传上传。";
      } else if (status === 401 || status === 403) {
        hint = "请检查 Storage 上传策略（RLS）和 publishable key 对应的权限。";
      }
      return `${file.name}：${detail}${status ? `（HTTP ${status}）` : ""}${hint ? `\n${hint}` : ""}`;
    }

    uploadButton.addEventListener("click", () => fileInput.click());
    document.querySelectorAll(".filter").forEach((button) => button.addEventListener("click", () => {
      document.querySelector(".filter.active")?.classList.remove("active");
      button.classList.add("active"); activeCategory = button.dataset.category; render();
    }));

    fileInput.addEventListener("change", async (event) => {
      const selectedFiles = Array.from(event.target.files || []);
      if (!selectedFiles.length) return;
      try {
        const enteredKey = window.prompt("请输入上传确认密钥以继续：");
        if (enteredKey === null) return;
        if (enteredKey !== CONFIRMATION_KEY) { alert("确认密钥错误，已取消上传。"); return; }
        const categoryInput = window.prompt("请选择分类：PS、AI、AU 或 3D Max", "PS");
        if (categoryInput === null) return;
        const categoryMap = { ps:"PS", photoshop:"PS", ai:"AI", illustrator:"AI", au:"AU", audition:"AU", "3d max":"3D Max", "3dmax":"3D Max", "3ds max":"3D Max" };
        const category = categoryMap[categoryInput.trim().toLowerCase()];
        if (!category) { alert("请输入 PS、AI、AU 或 3D Max。"); return; }
        const invalidFiles = selectedFiles.filter((file) => !file.type.startsWith("image/") && !(category === "3D Max" && isMaxName(file.name)));
        if (invalidFiles.length) {
          alert(category === "3D Max" ? "3D Max 分类只支持图片文件或 .max 文件。" : "该分类只支持图片；.max 文件请放入 3D Max 分类。");
          return;
        }
        uploadButton.disabled = true;
        let uploadedCount = 0;
        const errors = [];
        for (const file of selectedFiles) {
          // .max 不是浏览器通用 MIME 类型；显式使用通用二进制类型，避免上传 File.type 为空或被错误推断。
          const isMax = category === "3D Max" && isMaxName(file.name);
          const contentType = isMax ? "application/octet-stream" : (file.type || "application/octet-stream");
          const safeName = file.name.normalize("NFKC").replace(/[\\/?%*:|"<>\x00-\x1f]/g, "_").trim() || (isMax ? "model.max" : "upload");
          const uniqueName = `${crypto.randomUUID()}__${safeName}`;
          const objectPath = `${storagePrefixes(category)[0]}/${uniqueName}`;
          try {
            const { error } = await supabaseClient.storage.from(BUCKET_NAME).upload(objectPath, file, {
              cacheControl: "3600", contentType, upsert: false
            });
            if (error) { console.error("Supabase Storage 上传失败", { file: file.name, size: file.size, contentType, statusCode: error.statusCode, error }); errors.push(uploadErrorMessage(error, file)); }
            else uploadedCount += 1;
          } catch (error) {
            console.error("上传文件时发生网络或客户端错误", { file: file.name, size: file.size, contentType, error });
            errors.push(uploadErrorMessage(error, file));
          }
        }
        if (uploadedCount > 0) await loadWorks();
        if (errors.length) alert(`成功上传 ${uploadedCount} 个，失败 ${errors.length} 个：\n\n${errors.join("\n\n")}`);
        else if (uploadedCount) alert(`成功上传 ${uploadedCount} 个文件。`);
      } catch (error) {
        console.error("上传流程失败：", error);
        alert(`操作失败：${error.message || "请检查网络及 Supabase Storage 配置。"}`);
      } finally {
        uploadButton.disabled = false;
        fileInput.value = "";
      }
    });

    async function loadWorks() {
      isLoading = true; render();
      try {
        const results = await Promise.all(CATEGORIES.map(async (category) => {
          const prefixResults = await Promise.all(storagePrefixes(category).map(async (prefix) => {
            const { data, error } = await supabaseClient.storage.from(BUCKET_NAME).list(prefix, { limit: 1000, sortBy: { column: "created_at", order: "desc" } });
            if (error) throw error;
            return (data || []).filter((object) => object.name && object.metadata).map((object) => {
              const objectPath = `${prefix}/${object.name}`;
              const { data: publicData } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(objectPath);
              const name = object.name.includes("__") ? object.name.slice(object.name.indexOf("__") + 2) : object.name;
              return { path: objectPath, name, category, size: Number(object.metadata.size) || 0, url: publicData.publicUrl, createdAt: object.created_at || "" };
            });
          }));
          return prefixResults.flat();
        }));
        works.splice(0, works.length, ...results.flat());
        works.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
      } catch (error) {
        console.error("读取 Supabase Storage 失败：", error);
        document.getElementById("count").textContent = "作品加载失败";
      } finally { isLoading = false; render(); }
    }

    async function deleteWork(item, button) {
      if (!window.confirm(`确定要永久删除「${item.name}」吗？此操作无法撤销。`)) return;
      const enteredKey = window.prompt("请输入删除确认密钥以继续：");
      if (enteredKey === null) return;
      if (enteredKey !== CONFIRMATION_KEY) { alert("确认密钥错误，未删除作品。"); return; }
      button.disabled = true; button.textContent = "删除中…";
      try {
        const { error } = await supabaseClient.storage.from(BUCKET_NAME).remove([item.path]);
        if (error) throw error;
        const index = works.findIndex((work) => work.path === item.path);
        if (index !== -1) works.splice(index, 1);
        render();
      } catch (error) {
        console.error("删除 Supabase Storage 文件失败：", error);
        alert(`删除失败：${error.message || "请检查 Storage 删除权限后重试。"}`);
        button.disabled = false; button.textContent = "删除";
      }
    }

    function render() {
      const visibleWorks = activeCategory === "全部" ? works : works.filter((item) => item.category === activeCategory);
      document.getElementById("count").textContent = isLoading ? "正在加载作品…" : `共 ${works.length} 件作品`;
      grid.replaceChildren();
      if (isLoading && works.length === 0) { const loading = document.createElement("div"); loading.className = "empty"; loading.textContent = "正在从 Supabase 加载作品…"; grid.append(loading); return; }
      if (!visibleWorks.length) { const empty = document.createElement("div"); empty.className = "empty"; empty.innerHTML = "<div class='empty-icon'>🍮</div><strong>这里还空空的</strong><span>点击「上传作品」，添加第一份创作吧。</span>"; grid.append(empty); return; }
      visibleWorks.forEach((item) => {
        const card = document.createElement("article"); card.className = "card";
        const preview = document.createElement("div"); preview.className = "preview"; preview.addEventListener("click", () => openPreview(item));
        if (item.category === "3D Max" && isMaxName(item.name)) { const filePreview = document.createElement("div"); filePreview.className = "preview-file"; filePreview.innerHTML = "<span class='preview-file-icon'>📦</span><span>3DS MAX 文件</span>"; preview.append(filePreview); }
        else { const image = document.createElement("img"); image.src = item.url; image.alt = item.name; image.loading = "lazy"; preview.append(image); }
        const info = document.createElement("div"); info.className = "card-info"; const title = document.createElement("h3"); title.className = "card-title"; title.textContent = item.name;
        const meta = document.createElement("div"); meta.className = "card-meta"; const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = item.category;
        const size = document.createElement("span"); size.className = "file-size"; size.textContent = formatSize(item.size);
        const deleteButton = document.createElement("button"); deleteButton.className = "delete-button"; deleteButton.type = "button"; deleteButton.textContent = "删除"; deleteButton.setAttribute("aria-label", `删除作品 ${item.name}`); deleteButton.addEventListener("click", () => deleteWork(item, deleteButton));
        meta.append(tag, size, deleteButton); info.append(title, meta); card.append(preview, info); grid.append(card);
      });
    }

    function openPreview(item) {
      const content = document.getElementById("modalContent"); content.replaceChildren();
      document.getElementById("modalTitle").textContent = item.name;
      if (item.category === "3D Max" && isMaxName(item.name)) {
        const download = document.createElement("div"); download.className = "max-download";
        const description = document.createElement("span"); description.textContent = "这是 3D Max 项目文件，浏览器无法直接预览。";
        const link = document.createElement("a"); const downloadUrl = new URL(item.url); downloadUrl.searchParams.set("download", item.name); link.href = downloadUrl.toString(); link.rel = "noopener"; link.download = item.name; link.textContent = "下载 .max 文件";
        download.append(description, link); content.append(download);
      } else { const image = document.createElement("img"); image.src = item.url; image.alt = item.name; content.append(image); }
      dialog.showModal();
    }
    document.getElementById("closeModal").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", (event) => { if (event.target === dialog) dialog.close(); });
    loadWorks();
  </script>
</body>
</html>
